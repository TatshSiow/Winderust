name: Draft Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable

      - name: Validate tag and package version
        shell: pwsh
        run: |
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("v$version" -ne "${{ github.ref_name }}") {
              throw "Tag ${{ github.ref_name }} does not match Cargo version $version"
          }

      - name: Ensure ripgrep is available
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
              choco install ripgrep --yes --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          rg --version

      - name: Check architecture ownership
        run: .\scripts\check_architecture_ownership.ps1

      - name: Check legacy names
        run: .\scripts\check_legacy_names.ps1

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings -D unsafe-op-in-unsafe-fn

      - name: Run tests
        run: cargo test --locked

      - name: Build release executable
        shell: pwsh
        run: .\scripts\build_release.cmd

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\Winderust | Out-Null
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pattern = "(?ms)^## $([regex]::Escape($version)) - [^\r\n]+\r?\n.*?(?=^## |\z)"
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern)
          if (-not $section.Success) {
              throw "CHANGELOG.md has no release section for $version"
          }
          git fetch --force --tags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previousTag = git tag --sort=-version:refname |
              Where-Object { $_ -ne "${{ github.ref_name }}" } |
              Select-Object -First 1
          $notes = $section.Value.TrimEnd()
          if ($previousTag) {
              $notes += "`r`n`r`n**Full Changelog**: https://github.com/${{ github.repository }}/compare/$previousTag...${{ github.ref_name }}"
          }
          $notes | Set-Content -Encoding utf8 dist\release-notes.md
          Copy-Item target\release\winderust.exe, LICENSE, README.md, CHANGELOG.md dist\Winderust
          Compress-Archive -Path dist\Winderust -DestinationPath dist\Winderust-${{ github.ref_name }}-windows-x64.zip
          Get-FileHash dist\Winderust-${{ github.ref_name }}-windows-x64.zip -Algorithm SHA256 |
              ForEach-Object { "$($_.Hash.ToLower())  Winderust-${{ github.ref_name }}-windows-x64.zip" } |
              Set-Content -Encoding ascii dist\Winderust-${{ github.ref_name }}-windows-x64.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Winderust-${{ github.ref_name }}-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" dist\Winderust-${{ github.ref_name }}-windows-x64.zip dist\Winderust-${{ github.ref_name }}-windows-x64.zip.sha256 --draft --prerelease --notes-file dist\release-notes.md --verify-tag --title "${{ github.ref_name }}"
