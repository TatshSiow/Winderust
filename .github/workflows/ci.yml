name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Ensure ripgrep is available
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
              choco install ripgrep --yes --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          rg --version

      - name: Check architecture ownership
        run: .\scripts\check_architecture_ownership.ps1

      - name: Check legacy names
        run: .\scripts\check_legacy_names.ps1

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings -D unsafe-op-in-unsafe-fn

      - name: Run tests
        run: cargo test --locked
