version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    groups:
      windui:
        patterns: ["windui"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
