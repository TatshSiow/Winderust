  intro_1: "Winderust checks apps with Resource Thresholds rules once per second, including in tray mode. Rules combine CPU and memory usage at each matching executable path by default. Per instance checks each process separately. Working Set measures resident memory in MB or as a percentage of physical RAM and may count shared pages more than once. Private Commit measures memory Windows has committed privately for those processes. One MB equals 1,000,000 bytes. One configuration applies to every power source."
  intro_2: "The Windows notification switch applies to all rules. Check Notify on each rule that should send alerts. Each rule can use the default sustained duration or set its own for both monitors. Automatic actions require At or above, Combined by path, and an executable path. Simultaneous CPU and memory restarts launch the app only once. Critical replaces a simultaneous warning for the same resource. Responses fire once per incident. At or above rearms below 95% of its threshold. At or below rearms when usage exceeds the threshold and reaches 105% of it or the metric maximum, whichever is lower. A zero threshold rearms at any positive value. App restarts, monitoring changes, and disabling restart observation. Observation continues across power source changes."
  intro_3: "Notifications keep the Winderust tray icon available and respect Windows notification settings. Closing behavior remains controlled by Winderust Behaviour. Automatic actions are disabled by default and may lose unsaved work when enabled. Windows access checks, protected-process rules, exact process identity, and cross-session settings still apply. Winderust never targets itself. Restart preserves the original Windows logon and privileges, supports only apps in Winderust's Windows session, and excludes service accounts."
