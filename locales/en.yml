instance_limits:
  enable: "Enable Instance Limits"
  enable_help: "Monitor the number of processes for each selected executable without stopping or blocking apps. Shared across Plugged In and On Battery."
  notify: "Notify when the maximum is exceeded"
  notify_help: "Show Windows alerts when a rule with Notify checked exceeds its maximum. All enabled rules still count processes."
  intro_1: "Monitor how many processes run at each selected executable path in your Windows user session. This feature never stops an app or prevents it from starting."
  intro_2: "Counts refer to processes, not windows or tabs. Samples run about once a second and can miss short-lived processes. Other users and sessions are excluded."
  intro_3: "An alert needs two fresh samples above the maximum. Recovery needs two complete samples at or below it. An incomplete count is only a verified lower bound; unknown counts never clear an alert. Windows controls notification visibility."
