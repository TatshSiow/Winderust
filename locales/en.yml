keep_running:
  relaunched: "Relaunched app."
  enable: "Enable Keep Running"
  enable_help: "Relaunch an app after all verified instances exit. Start it yourself once to arm its rule. Check Notify for rules that should alert when retries run out. Shared across Plugged In and On Battery."
  intro_1: "Start the app yourself once to arm its rule. Winderust then relaunches one instance after every verified instance exits."
  intro_2: "Stop actions in Winderust, Resource Thresholds actions, sleep and session changes pause relaunching. Closing the app normally still counts as an exit. Use Resume after reviewing the pause reason. Retries are limited."
  intro_3: "Relaunching starts a fresh ordinary desktop app. Packaged apps, launchers, protected apps and some existing job restrictions may be unsupported."
