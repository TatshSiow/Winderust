cpu_limiter:
  enable: "Enable CPU Limiter"
  intro_1: "CPU Limiter briefly freezes and resumes selected app groups to target a chosen share of CPU time."
  intro_2: "Focus, Visible Window, and Background defaults set the intended share of each 100 ms cycle that an app can run, from 1% to 100%. A 100% target means Unlimited."
  intro_3: "This is a freeze/thaw duty-cycle limit, not processor affinity or a Windows CPU-rate hard cap. Child processes launched after the limit starts join the same app group."
  intro_4: "Very low targets are approximate because Windows freeze/thaw transitions take time. Low percentages can also make audio, video, networking, and interactive apps stutter."
  intro_5: "Existing child processes outside the managed group are not captured; only the matched process and children launched after limiting starts are included."
