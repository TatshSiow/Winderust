instance_balancing:
  enable: "Enable Instance Balancing"
  enable_help: "Balance two or more matching processes using separate whole-core scheduling preferences. Shared across Plugged In and On Battery."
  intro_1: "Balance two or more running processes from the same executable path across separate whole-core scheduling preferences."
  intro_2: "Only the current Windows user session is eligible. Winderust waits for stable membership and yields to explicit CPU selection rules. Disabling a rule restores its managed preferences."
  intro_3: "Requires one active processor group and enough eligible whole cores for every instance. These preferences do not reserve cores or guarantee better performance."
  edit_rule: "Edit Instance Balancing rule"
  invalid: "Choose a supported absolute executable path. Each path can have only one rule. Winderust and protected system apps cannot be selected."
  conflict: "Equivalent executable paths cannot have separate Instance Balancing rules."
  changed: "Instance Balancing withdrew the plan because its context or membership changed."
  missing_live: "A previously observed live instance is missing from the process catalog."
  explicit_selection: "Excluded by an explicit CPU selection rule."
  not_accepted: "Instance Balancing could not apply every share; the whole rule yielded."
  disabled: "Instance Balancing is disabled."
  waiting_context: "Instance Balancing is waiting for a fresh Windows session observation."
  no_enabled_rules: "No Instance Balancing rules are enabled."
  waiting: "Waiting for at least two eligible instances."
  insufficient_capacity: "Not enough eligible whole cores for every instance; the rule yielded."
  waiting_stable: "Waiting for stable instances and the next permitted plan change."
  assigned: "Applied scheduling preferences to %{count} instances."

