instance_balancing:
  enable: "啟用執行個體平衡"
  enable_help: "向 Windows 建議為同一應用程式的多個執行個體使用不同的完整核心。插電與電池模式共用此設定。"
  rules_help: "規則適用於目前的 Windows 工作階段，以明確指定的 CPU 選擇規則為優先。平衡需要單一作用中的處理器群組及足夠的合格完整核心。停用規則時，會還原先前的 CPU 偏好。"
  edit_rule: "編輯執行個體平衡規則"
  invalid: "請選擇支援的執行檔絕對路徑。每個路徑只能有一條規則，不可選擇 Winderust 與受保護的系統應用程式。"
  conflict: "等同的執行檔路徑不能分別設定執行個體平衡規則。"
  changed: "執行個體平衡因執行環境或成員變更而撤回配置。"
  missing_live: "先前觀察到且仍在執行的個體未出現在處理程序清單中。"
  explicit_selection: "已由明確指定的 CPU 選擇規則排除。"
  not_accepted: "執行個體平衡無法套用所有分配；整條規則已讓出控制權。"
  disabled: "執行個體平衡已停用。"
  waiting_context: "執行個體平衡正在等待新的 Windows 工作階段觀察。"
  no_enabled_rules: "目前沒有啟用的執行個體平衡規則。"
  waiting: "等待至少兩個符合條件的執行個體。"
  insufficient_capacity: "符合條件的完整核心不足以分配給所有執行個體；規則已讓出控制權。"
  waiting_stable: "等待執行個體穩定及下一次允許的配置變更。"
