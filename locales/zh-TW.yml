cpu_limiter:
  enable: "啟用 CPU 限制器"
  intro_1: "CPU 限制器會短暫凍結與恢復選取的應用程式群組，以達到所選的 CPU 時間目標。"
  intro_2: "焦點、可見視窗與背景的預設值可設定應用程式在每個 100 毫秒週期中預計可執行的比例，範圍為 1% 到 100%；100% 代表不限制。"
  intro_3: "這是以凍結／解凍實作的工作週期限制，不是處理器親和性或 Windows CPU 速率硬上限。限制開始後啟動的子程序會加入相同群組。"
  intro_4: "Windows 的凍結／解凍轉換需要時間，因此極低的目標值僅為近似值；低百分比也可能使音訊、視訊、網路與互動式應用程式發生卡頓。"
  intro_5: "受管理群組外的既有子程序不會被納入；只有相符程序與限制開始後啟動的子程序會加入群組。"
  limited_processes: "受限制程序"
  tracked_processes: "追蹤中的程序"
  rules: "自訂規則"
  rules_help: "每個層級都可跟隨頁面預設值、使用 1% 到 100% 的自訂目標，或設為不限制；100% 等同不限制。"
