  enable_help: "對選取的應用程式套用 CPU 時間限制或負載觸發的處理器親和性。"
  intro_1: "CPU 限制器為每個應用程式提供兩種限制方式。CPU 時間限制會短暫凍結與恢復應用程式群組，以達到所選的週期比例。"
  intro_2: "焦點、可見視窗與背景的預設值可設定應用程式在每個 100 毫秒週期中預計可執行的比例，範圍為 1% 到 100%；100% 代表不限制。"
  intro_3: "CPU 時間限制涵蓋相符的處理程序與限制開始後啟動的子處理程序。受管理群組外的既有子處理程序會維持原狀。"
  intro_4: "Windows 的凍結／解凍轉換需要時間，因此極低的目標值僅為近似值；低百分比也可能使音訊、視訊、網路與互動式應用程式發生卡頓。"
  intro_5: "負載觸發的處理器親和性會在 CPU 使用率持續達到閾值後，暫時將相符的處理程序限制於所選的邏輯處理器。限制期間，處理程序仍可使用所有可用的處理器。"
