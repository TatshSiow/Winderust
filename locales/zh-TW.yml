  launch_settings: "啟動設定"
  arguments: "引數（選填）"
  working_directory: "工作目錄"
  launch_help: "引數會原樣傳入並以純文字儲存，請自行依應用程式需求加上引號。全新啟動不會還原開啟的文件、原始引數或環境。"
  invalid: "請使用不含引號或 NUL 字元的執行檔及工作目錄絕對路徑。引數不可包含 NUL。加上引號後的命令列不得超過 32767 個 UTF-16 碼元，每個執行檔只能有一條規則。"
