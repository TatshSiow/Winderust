keep_running:
  relaunched: "已重新啟動應用程式。"
  enable: "啟用持續執行"
  enable_help: "所有已確認的執行個體結束後，重新啟動應用程式。請先自行啟動一次，讓規則開始監控。勾選通知的規則會在達到重試上限時發出通知。插電與電池模式共用此設定。"
  intro_1: "請先自行啟動應用程式一次，讓規則進入監控狀態。所有已確認的執行個體結束後，Winderust 會重新啟動一個執行個體。"
  intro_2: "在 Winderust 中執行停止動作、資源門檻動作、睡眠與工作階段變更都會暫停重新啟動。正常關閉應用程式仍會觸發重新啟動。請確認暫停原因後再按「繼續」。重試次數有限。"
  intro_3: "重新啟動會開啟一般桌面應用程式的新執行個體。封裝的應用程式、啟動器、受保護的應用程式或受某些既有作業物件限制的應用程式可能無法重新啟動。"
  add_rule: "新增持續執行規則"
