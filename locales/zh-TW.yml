  termination_failed: "終止失敗：%{error}"
  termination_requested: "已要求終止 %{count} 個處理程序。"
  intro_1: "Winderust 每秒檢查設有資源門檻規則的應用程式，視窗隱藏時也會檢查。預設依相符的執行檔路徑合計 CPU 與記憶體使用量。依執行個體模式會逐一檢查各處理程序。工作集以 MB 或實體 RAM 百分比表示常駐記憶體，共用頁面可能重複計算。認可大小是 Windows 為這些處理程序認可的私人記憶體量。1 MB 等於 1,000,000 位元組。所有電源狀態共用同一組設定。"
  intro_2: "Windows 通知開關適用於所有規則。勾選需要發送警示的規則的通知欄位。每條規則可使用預設持續使用時間，或為兩種監控自訂共用時間。自動動作須使用達到或高於門檻、依路徑合計，並指定執行檔路徑。CPU 與記憶體同時要求重新啟動時，僅啟動程式一次。同一資源同時符合兩種門檻時，以嚴重回應為準。每次事件只會觸發一次。達到或高於門檻的警示會在使用量降至門檻的 95% 以下時重新啟用。達到或低於門檻的警示會在使用量超過門檻，並達到門檻的 105% 或指標上限（取較低者）時重新啟用。門檻為 0 時，任何正值都會重新啟用警示。程式重新啟動、監控設定變更或停用會重新開始觀察。切換電源來源時會繼續觀察。"
  intro_3: "啟用通知會保留 Winderust 在通知區域中的圖示，並遵循 Windows 通知設定。視窗關閉行為仍由 Winderust 行為設定控制。預設不執行自動動作，啟用後可能遺失未儲存工作。Windows 權限檢查、受保護的處理程序、執行個體身分與跨工作階段設定仍適用。Winderust 不會監控自己。重新啟動會保留原本的 Windows 登入與權限，僅支援 Winderust 所在工作階段的應用程式，服務帳戶除外。"
